apiVersion: 1
groups:
    - orgId: 1
      name: Enterprise DevOps Monitoring
      folder: Enterprise DevOps Alerts
      interval: 1m
      rules:
        - uid: aftb0yfh7h24gd
          title: ' Pod Restart Detected'
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: builder
                expr: kube_pod_container_status_restarts_total{namespace="enterprise-devops"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          annotations:
            description: One or more containers in the enterprise-devops namespace have restarted.
            summary: One or more containers in the enterprise-devops namespace have restarted.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: DevOps Email Alerts
