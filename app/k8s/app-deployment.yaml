apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-platform
  namespace: enterprise-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-platform

  template:
    metadata:
      labels:
        app: enterprise-platform

    spec:
      containers:
        - name: enterprise-platform
          image: enterprise-devops-platform:v4
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: enterprise-config

            - secretRef:
                name: enterprise-secret

          readinessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10