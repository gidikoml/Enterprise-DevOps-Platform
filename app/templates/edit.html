<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<h1>Enterprise DevOps Platform</h1>

<h2>Edit User</h2>

<hr>

<form action="/update/{{ user.id }}" method="POST">

    <label>Full Name</label><br>

    <input
        type="text"
        name="fullname"
        value="{{ user.name }}"
        required
    >

    <br><br>

    <label>Email</label><br>

    <input
        type="email"
        name="email"
        value="{{ user.email }}"
        required
    >

    <br><br>

    <label>Phone Number</label><br>

    <input
        type="text"
        name="phone"
        value="{{ user.phone }}"
        required
    >

    <br><br>

    <button type="submit">

        Update User

    </button>

</form>

<br>

<a href="/users">

← Back to Users

</a>

</body>

</html>
